[project]
name = "store"
version = "0.1.0"
description = "Moldova RO/RU e-commerce platform"
requires-python = "==3.14.*"
# Runtime dependencies are added by the slice that first uses one. Celery, a cache
# client, DRF, an email/SMS/CRM/search/pooler package and a connection pooler are all
# deliberately absent: phase-1/01 §2 and phase-1/02 §1 record them as not added, and a
# queue provisioned for an unenabled workload is forbidden by the launch cut (item 14).
dependencies = [
    "django==6.1.1",
    "psycopg[binary]==3.3.5",
]

[dependency-groups]
# Upper bounds keep `uv lock --upgrade` from crossing a major on its own; the exact
# build always comes from uv.lock.
dev = [
    "django-stubs>=6.1.0,<6.2",
    "import-linter==2.15",
    "mypy>=2.3.1,<2.4",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.6",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
show_error_codes = true

# The harness and the suite are checked, but not held to `strict`'s annotation rules: a
# table-driven architecture case reads better without a return annotation on every entry.
[[tool.mypy.overrides]]
module = ["tests.*", "tools.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# A negative test deliberately does what the type system forbids, in order to prove the
# *runtime* rejects it: comparing a PublicId to an EventId to assert they never match
# (C127), or assigning an unknown attribute to assert `__slots__` raises. `strict_equality`
# and `warn_unused_ignores` flag exactly those lines, so they are off for the suite alone.
# Real error classes — arg-type, attr-defined, return-value — stay on.
[[tool.mypy.overrides]]
module = ["tests.*"]
strict_equality = false
warn_unused_ignores = false

[tool.django-stubs]
# `tests.settings` seeds throwaway values for the required env vars and then re-exports
# `config.settings` unchanged. It must be used here: the django-stubs plugin imports the
# settings module while constructing its Django context, and `config.settings` raises
# ImproperlyConfigured when a secret is absent — by design, so no secret has a checked-in
# default. Pointing at `config.settings` makes every mypy run fail with INTERNAL ERROR.
django_settings_module = "tests.settings"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Generated by `makemigrations`; never hand-wrapped, so line length does not apply.
# No migration exists yet — this entry is in place for the slice that writes the first.
"**/migrations/*.py" = ["E501"]
# Settings map environment to objects; a long DSN or validator path is not worth wrapping.
"config/settings.py" = ["E501"]
# `from config.settings import *` is the deliberate mechanism, not an oversight: the test
# settings must re-export the launch settings unchanged (see the module docstring).
"tests/settings.py" = ["F403"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
# `--strict-markers` fails an unregistered marker instead of silently ignoring it;
# `--strict-config` fails on an unknown key in this section rather than dropping it.
addopts = "-q --strict-markers --strict-config"

# ---------------------------------------------------------------------------
# Architecture import contracts (Phase 0 item 3 §15.1, L1-L19)
#
# Contracts are stated over the packages that physically exist in this slice.
# Rules whose subject modules do not exist yet (domain/application internals,
# `core` submodules, `ports.py`) are enforced by tools/arch_check instead, so
# that no invariant is weakened while waiting for a package to appear.
# See docs/architecture/phase-1/01-repository-bootstrap.md §6.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = [
    "core",
    "domains",
    "application",
    "interfaces",
    "integrations",
    "tasks",
    "config",
    "tests",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "L1 core imports nothing above it"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "domains",
    "application",
    "interfaces",
    "integrations",
    "tasks",
    "config",
]

[[tool.importlinter.contracts]]
name = "L2 domains are mutually invisible"
type = "independence"
modules = [
    "domains.accounts",
    "domains.catalog",
    "domains.content",
    "domains.delivery",
    "domains.inventory",
    "domains.notifications",
    "domains.orders",
    "domains.payments",
    "domains.pricing",
    "domains.promotions",
    "domains.reviews",
    "domains.stores",
]

[[tool.importlinter.contracts]]
name = "L3 domains import nothing above or sideways"
type = "forbidden"
source_modules = ["domains"]
forbidden_modules = [
    "application",
    "interfaces",
    "tasks",
    "integrations",
    "config",
]

[[tool.importlinter.contracts]]
name = "L5 application to application is forbidden"
type = "independence"
modules = [
    "application.checkout",
    "application.erp_sync",
    "application.payments_gateway",
    "application.storefront",
]

[[tool.importlinter.contracts]]
name = "L6 application imports no interfaces, tasks, integrations or config"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = ["interfaces", "tasks", "integrations", "config"]

[[tool.importlinter.contracts]]
name = "L8 integrations reach application only through ports"
type = "forbidden"
source_modules = ["integrations"]
forbidden_modules = [
    "domains",
    "interfaces",
    "tasks",
    "config",
    "application",
]
ignore_imports = ["integrations.** -> application.*.ports"]
# The exception exists before any port does; an unmatched entry is not a failure here.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "L9 vendor packages are isolated from one another"
type = "independence"
modules = ["integrations.erp", "integrations.maib"]

[[tool.importlinter.contracts]]
name = "L11 tasks import no integrations and no interfaces"
type = "forbidden"
source_modules = ["tasks"]
forbidden_modules = ["integrations", "interfaces"]

[[tool.importlinter.contracts]]
name = "L12/L17 only a webhook interface reaches a provider protocol surface"
type = "forbidden"
source_modules = ["interfaces"]
forbidden_modules = ["integrations"]
ignore_imports = [
    "interfaces.webhooks.** -> integrations.*.protocol",
    "interfaces.webhooks.** -> integrations.*.protocol.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "L14 no production package imports tests"
type = "forbidden"
source_modules = [
    "core",
    "domains",
    "application",
    "interfaces",
    "integrations",
    "tasks",
    "config",
]
forbidden_modules = ["tests"]

[[tool.importlinter.contracts]]
name = "L16 entry points never import the composition root"
type = "forbidden"
source_modules = ["interfaces", "tasks"]
forbidden_modules = ["config"]

[[tool.importlinter.contracts]]
# ADR-0006 §1/§2: an adapter answers no authorization question and never raises or
# interprets a domain public error. The migration half of L20/L21 stays with
# tools/arch_check, because no migration exists for a path-scoped contract to name yet.
name = "L20/L21 the public-contract primitives are closed to adapters"
type = "forbidden"
source_modules = ["integrations"]
forbidden_modules = ["core.actor", "core.errors"]

[[tool.importlinter.contracts]]
name = "L18 a provider protocol surface carries no client or SDK code"
type = "forbidden"
source_modules = ["integrations.erp.protocol", "integrations.maib.protocol"]
forbidden_modules = ["integrations.erp.outbound", "integrations.maib.outbound"]
